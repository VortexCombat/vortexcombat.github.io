<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c10"><meta name="robots" content="noindex">
  <title>Page not found — VortexCombat</title>
  <link rel="icon" type="image/png" href="favicon.png"><link rel="stylesheet" href="styles.css">
</head>
<body class="dark error-page">
  <main class="error-main">
    <a class="brand" href="/" aria-label="VortexCombat home"><span class="brand-mark" aria-hidden="true"><span>V</span></span><span class="brand-name">VortexCombat</span></a>
    <div class="error-art" aria-hidden="true"><span>4</span><i></i><span>4</span></div>
    <div class="error-copy">
      <p class="eyebrow"><span class="status-dot"></span> Error 404</p>
      <h1>Nothing lives<br><em>here yet.</em></h1>
      <p>The page may have moved, or perhaps it never existed. Let’s get you back somewhere familiar.</p>
      <a class="button button-primary" href="/">Return home <span aria-hidden="true">↖</span></a>
    </div>
  </main>
  <style>
    .error-page{background:var(--night);color:var(--white)}.error-main{min-height:100svh;width:min(1180px,calc(100% - 3rem));margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:5vw;align-items:center;position:relative;padding-block:7rem}.error-main>.brand{position:absolute;top:2rem;left:0}.error-main .brand-mark{background:var(--white);color:var(--night)}.error-copy h1{font-size:var(--step-5)}.error-copy>p:not(.eyebrow){color:#a4a6ad;max-width:32rem}.error-copy .button{margin-top:2rem;background:var(--white);color:var(--night)}.error-art{height:30rem;display:flex;align-items:center;justify-content:center;font-size:14rem;font-weight:800;letter-spacing:-.14em;color:#202229;position:relative}.error-art i{width:7rem;height:15rem;background:var(--accent);display:block;clip-path:polygon(50% 0,100% 100%,0 100%);transform:rotate(18deg);margin-left:1rem}@media(max-width:760px){.error-main{grid-template-columns:1fr;padding-top:8rem}.error-art{position:absolute;opacity:.35;font-size:10rem;height:auto;top:9rem;right:0}.error-copy{position:relative;z-index:2}}
  </style>
</body>
</html>
